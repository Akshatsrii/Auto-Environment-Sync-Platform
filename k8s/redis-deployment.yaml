apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsync-redis
  labels:
    app: devsync-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsync-redis
  template:
    metadata:
      labels:
        app: devsync-redis
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
