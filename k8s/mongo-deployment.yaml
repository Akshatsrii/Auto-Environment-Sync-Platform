apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsync-mongo
  labels:
    app: devsync-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devsync-mongo
  template:
    metadata:
      labels:
        app: devsync-mongo
    spec:
      containers:
      - name: mongo
        image: mongo:6.0
        ports:
        - containerPort: 27017
          name: mongo
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "256Mi"
      volumes:
      - name: mongo-storage
        persistentVolumeClaim:
          claimName: devsync-mongo-pvc
