name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["Build & Publish Docker Images"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    name: Apply Manifests & Restart Services
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Deploy ConfigMap and Secrets
      run: |
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secrets.yaml

    - name: Deploy Storage Claim & Database
      run: |
        kubectl apply -f k8s/mongo-pvc.yaml
        kubectl apply -f k8s/mongo-deployment.yaml
        kubectl apply -f k8s/mongo-service.yaml
        kubectl apply -f k8s/redis-deployment.yaml
        kubectl apply -f k8s/redis-service.yaml

    - name: Deploy Application Pods
      run: |
        kubectl apply -f k8s/server-deployment.yaml
        kubectl apply -f k8s/server-service.yaml
        kubectl apply -f k8s/client-deployment.yaml
        kubectl apply -f k8s/client-service.yaml

    - name: Deploy Ingress Rules
      run: |
        kubectl apply -f k8s/ingress.yaml

    - name: Trigger Rolling Restart (to fetch updated images)
      run: |
        kubectl rollout restart deployment/devsync-server
        kubectl rollout restart deployment/devsync-client

    - name: Verify Rollout Status
      run: |
        kubectl rollout status deployment/devsync-server --timeout=60s
        kubectl rollout status deployment/devsync-client --timeout=60s
